# ─── Render Blueprint (Infrastructure as Code) ───
# Render reads this file from the repository root.
# See: https://docs.render.com/blueprint-spec

services:
  - type: web
    name: smart-doc-backend      # kept so the existing Render service is reused
    runtime: python
    rootDir: backend
    buildCommand: ./build.sh
    # --proxy-headers so rate limiting sees the real client IP behind Render's proxy
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.12"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: JWT_SECRET_KEY
        generateValue: true     # random 256-bit secret generated by Render
      - key: GEMINI_API_KEY
        sync: false             # set in the Render dashboard
      - key: DATABASE_URL
        sync: false             # Postgres URL (Render/Neon/Supabase); without it data is lost on restart
      - key: CORS_ORIGINS
        sync: false             # your Vercel URL, e.g. https://your-app.vercel.app
