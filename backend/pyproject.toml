[project]
name = "structify-backend"
version = "0.1.0"
description = "Structify: transform SRS documents into structured architectures, Mermaid diagrams, and deployable boilerplate."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.0.0",
    "google-genai>=1.0.0",
    "pymupdf>=1.25.0",
    "python-docx>=1.0.0",
    "aiofiles>=24.0.0",
    "charset-normalizer>=3.3.0",
    "email-validator>=2.1.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.2,<4",
    "pyjwt>=2.8.0",
    "bcrypt>=4.0.1",
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "ruff>=0.6.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]  # B008: FastAPI's Depends() in defaults is idiomatic

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
